<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>FI Pickleball - Lịch thi đấu</title>
<style>
@page{size:A0 landscape;margin:0}*{box-sizing:border-box}body{margin:0;background:#0795d4;font-family:Arial,sans-serif;color:#103a57}.page{width:1189mm;height:841mm;padding:20mm;overflow:hidden;background:#0795d4}.top{height:55mm;color:white;position:relative}.brand{font-weight:800;font-size:11mm}.title{font-weight:900;font-size:24mm;color:#c7ff00}.subtitle{position:absolute;left:300mm;top:18mm;background:#103a57;padding:6mm 16mm;font-size:15mm;font-weight:900}.groups{display:grid;grid-template-columns:59fr 41fr;gap:10mm;height:455mm}.section{background:#f5fcff;border-radius:10mm;padding:5mm}.section h2{margin:0 0 4mm;background:#d8ff44;border-radius:6mm;padding:4mm 8mm;font-size:8mm}.men h2{background:#bdebff}.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm}.round h3{text-align:center;margin:0 0 2mm;font-size:5mm}.match{background:white;border:1px solid #b7d7e5;border-radius:4mm;padding:2.5mm;margin-bottom:2.2mm}.tag{font-size:3.2mm;font-weight:bold}.team{display:grid;grid-template-columns:13mm 1fr 11mm;gap:2mm;align-items:center;font-size:3.7mm;font-weight:700;border-top:1px solid #d8e8ef;padding-top:1.5mm;margin-top:1.5mm}.score{height:9mm;border:1.2mm solid #103a57;border-radius:2mm;background:#eaf8fc;text-align:center;font-size:6mm}.brackets{height:260mm;display:grid;grid-template-columns:1fr 1fr;gap:10mm;margin-top:10mm}.bracket{background:#103a57;border-radius:10mm;padding:7mm;color:white}.bracket h2{color:#c7ff00;margin:0 0 8mm;font-size:8mm}.tree{display:grid;grid-template-columns:1fr 1fr;gap:24mm;align-items:center}.semi{display:grid;gap:18mm}.bcard{background:white;color:#103a57;border:1mm solid #d8ff44;border-radius:5mm;padding:4mm;font-weight:700;font-size:5mm}.bcard b{display:block;background:#d8ff44;border-radius:3mm;padding:2mm;margin-bottom:3mm;width:max-content}.line{display:grid;grid-template-columns:1fr 12mm;gap:3mm;align-items:center;margin-top:2mm}.note{text-align:right;font-size:4mm;margin-top:-14mm}.hint{color:white;text-align:right;font-size:4mm;margin-top:4mm}[contenteditable]:focus{outline:2px dashed #ff8a00;background:#fffbe8}
</style></head><body><main class="page"><header class="top"><div class="brand">FPT SOFTWARE • DCE • F1.YU</div><div class="title">PICKLEBALL 2026</div><div class="subtitle">F1 CLUB OPEN</div></header><div class="groups"><section class="section"><h2>ĐÔI HỖN HỢP • 30 TRẬN</h2><div class="rounds" id="mixed"></div></section><section class="section men"><h2>ĐÔI NAM OPEN • 20 TRẬN</h2><div class="rounds" id="men"></div></section></div><div class="brackets" id="brackets"></div><div class="hint">Nhấp vào tên đội hoặc ô điểm để sửa • In ngang khổ A0</div></main>
<script>
const names={HH1:'TuyenPT1 / LongND49',HH2:'HangNT62 / LuanNT11',HH3:'HungVT3 / TamCQ',HH4:'ThoaNTP / VuNT15',HH5:'NamPT17 / AnhND',HH6:'HoangHH2 / HaDT7',HH7:'NgocDTB10 / AnhTD5',HH8:'SonLH / ManhMT',HH9:'AnhVH21 / MuiQT',HH10:'MyNT11 / LongND49',HH11:'TuyenNTK3 / TuanDQ7',HH12:'ChinhNH / BacNT3',NA1:'VietVH4 / ManhDD17',NA2:'AnhPT18 / AnhPV13',NA3:'TungNT141 / TungPV5',NA4:'DatVT46 / DungBT13',NA5:'BietNH / BinhTV13',NA6:'CuongHA / ViNC',NA7:'ThongTH5 / DacTT1',NA8:'LongTT / AnhDV54'};
const mixed=[[['HH1','HH12'],['HH2','HH11'],['HH3','HH10'],['HH4','HH9'],['HH5','HH8'],['HH6','HH7']],[['HH1','HH11'],['HH12','HH10'],['HH2','HH9'],['HH3','HH8'],['HH4','HH7'],['HH5','HH6']],[['HH1','HH10'],['HH11','HH9'],['HH12','HH8'],['HH2','HH7'],['HH3','HH6'],['HH4','HH5']],[['HH1','HH9'],['HH10','HH8'],['HH11','HH7'],['HH12','HH6'],['HH2','HH5'],['HH3','HH4']],[['HH1','HH8'],['HH9','HH7'],['HH10','HH6'],['HH11','HH5'],['HH12','HH4'],['HH2','HH3']]];
const men=[[['NA1','NA2'],['NA3','NA8'],['NA4','NA7'],['NA5','NA6']],[['NA1','NA3'],['NA2','NA4'],['NA5','NA8'],['NA6','NA7']],[['NA1','NA4'],['NA3','NA5'],['NA2','NA6'],['NA7','NA8']],[['NA1','NA5'],['NA4','NA6'],['NA3','NA7'],['NA2','NA8']],[['NA1','NA6'],['NA5','NA7'],['NA4','NA8'],['NA2','NA3']]];
function draw(id,data,start){let n=start;document.getElementById(id).innerHTML=data.map((round,i)=>`<div class="round"><h3>LƯỢT ${i+1}</h3>${round.map(([a,b])=>`<div class="match"><div class="tag">TRẬN ${String(n++).padStart(2,'0')}</div>${[a,b].map(t=>`<div class="team"><span>${t}</span><span contenteditable>${names[t]}</span><span class="score" contenteditable></span></div>`).join('')}</div>`).join('')}</div>`).join('')}
function bracket(title,p){return `<section class="bracket"><h2>${title}</h2><div class="note">Hai đội thua bán kết đồng hạng Ba</div><div class="tree"><div class="semi">${[[1,4],[2,3]].map((r,i)=>`<div class="bcard"><b>BÁN KẾT ${i+1}</b>${r.map(x=>`<div class="line"><span contenteditable>Hạng ${x} ${p}</span><span class="score" contenteditable></span></div>`).join('')}</div>`).join('')}</div><div class="bcard"><b>CHUNG KẾT</b><div class="line"><span contenteditable>Thắng Bán kết 1</span><span class="score" contenteditable></span></div><div class="line"><span contenteditable>Thắng Bán kết 2</span><span class="score" contenteditable></span></div></div></div></section>`}draw('mixed',mixed,1);draw('men',men,31);document.getElementById('brackets').innerHTML=bracket('VÒNG TRONG • ĐÔI HỖN HỢP','HH')+bracket('VÒNG TRONG • ĐÔI NAM OPEN','NA');
</script></body></html>
